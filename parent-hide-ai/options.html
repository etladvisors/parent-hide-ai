<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search Guard</title>
<style>
  :root {
    --paper: #E8EDEA;
    --card:  #FFFFFF;
    --ink:   #232C27;
    --muted: #6B7872;
    --moss:  #5E7C68;
    --hair:  #CBD5CE;
  }
  body {
    margin: 0;
    padding: 2.5rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, "Roboto", sans-serif;
    font-size: 15px;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 {
    font-family: Georgia, "Tinos", serif;
    font-weight: 400;
    font-size: 1.75rem;
    margin: 0 0 0.375rem;
  }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.6875rem 0.875rem;
    background: var(--card);
    border-radius: 6px;
    margin-bottom: 3px;
  }
  .row time { color: var(--muted); font-size: 0.875rem; white-space: nowrap; }
  .val { overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-style: italic; }
  button {
    font: inherit;
    background: none;
    color: var(--moss);
    border: 1px solid var(--hair);
    border-radius: 6px;
    padding: 0.5rem 0.875rem;
    cursor: pointer;
    margin-top: 1.5rem;
  }
  button:hover { border-color: var(--moss); }
</style>
</head>
<body>
  <main>
    <h1>Search Guard</h1>
    <p class="sub" id="status"></p>
    <div id="log"></div>
    <button id="clear" type="button">Clear this list</button>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
