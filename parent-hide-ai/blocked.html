<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search turned off</title>
<style>
  :root {
    --paper:  #E8EDEA;
    --ink:    #232C27;
    --muted:  #6B7872;
    --moss:   #5E7C68;
    --hair:   #CBD5CE;
    --serif:  Georgia, "Tinos", "Times New Roman", serif;
    --sans:   system-ui, "Roboto", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 34rem;
    width: 100%;
    animation: settle 480ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }

  /* The single deliberate flourish: a soft band that stands in for the
     result list that isn't going to load. Quiet on purpose. */
  .band {
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(
      90deg,
      var(--moss) 0%,
      var(--hair) 42%,
      transparent 100%
    );
    margin-bottom: 2.25rem;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.75rem, 4.5vw, 2.375rem);
    line-height: 1.2;
    letter-spacing: -0.012em;
    margin: 0 0 1.125rem;
  }

  p {
    font-size: 1.0625rem;
    line-height: 1.65;
    margin: 0 0 1rem;
    max-width: 30rem;
  }

  .muted { color: var(--muted); }

  .term {
    font-family: var(--serif);
    font-style: italic;
    color: var(--moss);
  }

  .support {
    margin-top: 2.5rem;
    padding-top: 1.375rem;
    border-top: 1px solid var(--hair);
    font-size: 0.9375rem;
    line-height: 1.6;
    color: var(--muted);
  }

  .support strong {
    display: block;
    color: var(--ink);
    font-weight: 600;
  }

  .actions { margin-top: 2rem; }

  button {
    font: inherit;
    font-size: 0.9375rem;
    color: var(--paper);
    background: var(--moss);
    border: 0;
    border-radius: 6px;
    padding: 0.625rem 1.25rem;
    cursor: pointer;
    transition: background 140ms ease;
  }

  button:hover  { background: #4E6A57; }
  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <main>
    <div class="band" aria-hidden="true"></div>

    <h1 id="heading">This search is turned off.</h1>

    <p id="detail" class="muted"></p>

    <p>
      A parent set this up on purpose. It isn't a punishment, and it isn't a
      record of anything you did wrong. If you think something is blocked that
      shouldn't be, say so &mdash; the list is meant to be adjusted.
    </p>

    <div class="actions">
      <button id="back" type="button">Go back</button>
    </div>

    <div class="support" id="support" hidden>
      <strong id="support-name"></strong>
      <span id="support-detail"></span>
    </div>
  </main>

  <script src="blocked.js" type="module"></script>
</body>
</html>
